# The Site Configuration

# Import the theme
theme: jekyll-theme-chirpy

lang: en

# Change to your timezone › https://zones.arilyn.cc
timezone: Africa/Cairo

# jekyll-seo-tag settings
# ↓ --------------------------

title: Mahmoud Attia # the main title

tagline: SOC Analyst | Threat Hunting | Detection Engineering # it will display as the subtitle

description: >- # used by seo meta and the atom feed
  Investigation write-ups, detection engineering, SOC automation, and CTF walkthroughs by Mahmoud Attia.

url: "https://mahmoud11atia.github.io"

github:
  username: mahmoud11atia

twitter:
  username:

social:
  name: Mahmoud Attia
  email: mahmoud0548331473@gmail.com
  fediverse_handle:
  links:
    # The first element serves as the copyright owner's link
    - https://github.com/mahmoud11atia
    - https://www.linkedin.com/in/mahmoud-attia-a8b4b921b/

# Site Verification Settings
webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# ↑ --------------------------
# The end of `jekyll-seo-tag` settings

# Web Analytics Settings
analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

# Page views settings
pageviews:
  provider:

theme_mode: # [light | dark]

cdn:

# the avatar on sidebar, support local or CORS resources
avatar: /assets/img/avatar.jpeg

social_preview_image:

toc: true

actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

comments:
  provider:
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position:
    lang:
    reactions_enabled:

assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 10

baseurl: ""

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
